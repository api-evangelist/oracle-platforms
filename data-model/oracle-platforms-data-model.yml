identifier_scheme:
  name: OCID
  format: 'ocid1.<resource-type>.<realm>.[region][.future use].<unique ID>'
  description: >-
    Every entity in every one of these APIs is keyed by an OCID, and the identifier is
    self-describing: the second segment names the resource type, so an agent holding an
    opaque id already knows what kind of thing it points at without a lookup. This is the
    single most useful structural fact about Oracle's data model.
root_entity:
  name: Compartment
  description: >-
    The organising entity of the entire estate. compartmentId is the most-referenced field
    in every single document — 188 occurrences in Core Services, 95 in Database, 74 in Data
    Science, 6 each in Analytics and Integration, 5 in Content Management. Nearly every list
    operation is scoped by it and nearly every create operation places into it. IAM policy
    is written against it. A model of this API that does not start with the compartment does
    not model this API.
