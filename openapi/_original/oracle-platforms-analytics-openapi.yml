basePath: /20190331
consumes:
- application/json
definitions:
  AccessControlServiceType:
    description: 'Various types of Oracle Service categories that can be whitelisted
      to access an Analytics instance.

      '
    enum: &id038
    - ALL
    type: string
  AnalyticsInstance:
    description: 'Analytics instance metadata.

      '
    properties:
      capacity: &id002
        $ref: '#/definitions/Capacity'
      compartmentId: &id003
        description: 'The OCID of the compartment.

          '
        maxLength: 255
        minLength: 1
        type: string
      definedTags: &id004
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only the String type is supported.

              '
            type: object
          description: 'Key-value pair representing a defined tag key and value, scoped
            to a namespace.


            Example: `{"CostCenter": "42"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped
          to a

          namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


          Example: `{"Operations": {"CostCenter": "42"}}`

          '
        type: object
      description: &id005
        description: 'Optional description.

          '
        maxLength: 512
        minLength: 0
        type: string
      domainId:
        description: 'Identity domain OCID.

          '
        type: string
      emailNotification: &id006
        description: 'Email address receiving notifications.

          '
        maxLength: 512
        minLength: 0
        type: string
      featureBundle: &id019
        description: 'The feature set of an Analytics instance.

          '
        enum: &id022
        - FAW_PAID
        - FAW_FREE
        - FDI_BASE
        - EE_EMBEDDED
        - SE_EMBEDDED
        type: string
        x-obmcs-top-level-enum: '#/definitions/FeatureBundle'
      featureSet: &id007
        description: 'The feature set. Either `SELF_SERVICE_ANALYTICS` (Professional
          Edition) or `ENTERPRISE_ANALYTICS` (Enterprise Edition).

          '
        enum: &id023
        - SELF_SERVICE_ANALYTICS
        - ENTERPRISE_ANALYTICS
        type: string
        x-obmcs-top-level-enum: '#/definitions/FeatureSet'
      freeformTags: &id008
        additionalProperties:
          type: string
        description: 'Free-form tags for this resource. Each tag is a simple key-value
          pair with no

          predefined name, type, or namespace. For more information, see [Resource
          Tags](/Content/General/Concepts/resourcetags.htm).


          Example: `{"Department": "Finance"}`

          '
        type: object
      id: &id009
        description: 'The resource OCID.

          '
        maxLength: 255
        minLength: 1
        type: string
      kmsKeyId: &id020
        description: 'OCID of the OCI Vault Key encrypting the customer data stored
          in this Analytics instance. A null value indicates that the default Oracle-managed
          encryption is used.

          '
        maxLength: 255
        minLength: 0
        type: string
      licenseType: &id010
        description: 'The license used for the service.

          '
        enum: &id030
        - LICENSE_INCLUDED
        - BRING_YOUR_OWN_LICENSE
        type: string
        x-obmcs-top-level-enum: '#/definitions/LicenseType'
      lifecycleState: &id011
        description: 'The current state of the Analytics instance.

          '
        enum: &id001
        - ACTIVE
        - CREATING
        - DELETED
        - DELETING
        - FAILED
        - INACTIVE
        - UPDATING
        type: string
        x-obmcs-top-level-enum: '#/definitions/AnalyticsInstanceLifecycleState'
      name: &id012
        description: 'The name of the Analytics instance. This name must be unique
          in the tenancy and can''t be changed.

          The name must start with a letter and can contain only letters, numbers
          and dash (-).

          '
        maxLength: 25
        minLength: 1
        pattern: ^[a-zA-Z](-?[a-zA-Z0-9])*$
        type: string
      networkEndpointDetails: &id013
        $ref: '#/definitions/NetworkEndpointDetails'
      privateAccessChannels:
        additionalProperties:
          $ref: '#/definitions/PrivateAccessChannel'
        description: 'Map of PrivateAccessChannel unique identifier key as KEY and
          PrivateAccessChannel Object as VALUE.

          '
        type: object
      resourceGroups:
        description: 'List of resource groups for this Analytics instance. The resource
          group id must be unique within the instance.

          '
        items:
          $ref: '#/definitions/InstanceResourceGroup'
        type: array
      serviceUrl: &id014
        description: 'URL of the Analytics instance.

          '
        maxLength: 1024
        minLength: 0
        type: string
      systemTags: &id015
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types
              are supported.

              '
            type: object
          description: 'Key-value pair representing system tags'' keys and values
            scoped to a namespace.

            Example: `{"key": "value"}`

            '
          type: object
        description: 'System tags for this resource. These predefined keys are scoped
          to namespaces.

          Example: `{"orcl-cloud": {"key": "value"}}`

          '
        type: object
      timeCreated: &id016
        description: 'The date and time the Analytics instance was created, in the
          format defined by RFC3339.


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      timeUpdated: &id017
        description: 'The date and time the Analytics instance was last updated (in
          the format defined by RFC3339).

          This timestamp represents updates made through this API. External events
          don''t

          affect it.

          '
        format: date-time
        type: string
      updateChannel: &id021
        description: 'The Analytics instance update cycle.

          '
        enum: &id039
        - REGULAR
        - EARLY
        - PHASE_2
        - PHASE_1
        type: string
        x-obmcs-top-level-enum: '#/definitions/UpdateChannel'
      vanityUrlDetails:
        additionalProperties:
          $ref: '#/definitions/VanityUrlDetails'
        description: 'Map of VanityUrl unique identifier key as KEY and VanityUrl
          Object as VALUE.

          '
        type: object
    required:
    - id
    - name
    - compartmentId
    - lifecycleState
    - capacity
    - networkEndpointDetails
    - featureSet
    - timeCreated
  AnalyticsInstanceLifecycleState:
    description: 'The current state of an Analytics instance.

      '
    enum: *id001
    type: string
  AnalyticsInstanceSummary:
    description: 'Analytics Instance metadata (summary view).

      '
    properties:
      capacity: *id002
      compartmentId: *id003
      definedTags: *id004
      description: *id005
      emailNotification: *id006
      featureSet: *id007
      freeformTags: *id008
      id: *id009
      licenseType: *id010
      lifecycleState: *id011
      name: *id012
      networkEndpointDetails: *id013
      serviceUrl: *id014
      systemTags: *id015
      timeCreated: *id016
      timeUpdated: *id017
    required:
    - id
    - name
    - compartmentId
    - lifecycleState
    - capacity
    - networkEndpointDetails
    - featureSet
    - timeCreated
  Capacity:
    description: 'Service instance capacity metadata (for example, OLPU count, number
      of users, and so on).

      '
    properties:
      capacityType:
        description: 'The capacity model to use.

          Accepted values are:

          OLPU_COUNT, USER_COUNT

          '
        enum: &id018
        - OLPU_COUNT
        - USER_COUNT
        type: string
        x-obmcs-top-level-enum: '#/definitions/CapacityType'
      capacityValue:
        description: 'The capacity value selected, either the number of OCPUs (OLPU_COUNT)
          or the number of users (USER_COUNT).

          This parameter affects the number of OCPUs, amount of memory, and other
          resources allocated to the Analytics instance.

          '
        minimum: 1
        type: integer
    required:
    - capacityType
    - capacityValue
    type: object
  CapacityType:
    description: 'Supported capacity types.

      '
    enum: *id018
    type: string
  ChangeAnalyticsInstanceNetworkEndpointDetails:
    description: 'Input payload to update endpoint details for an Analytics instance.

      '
    properties:
      networkEndpointDetails: *id013
    required:
    - networkEndpointDetails
  ChangeCompartmentDetails:
    description: 'Input payload to change a resource''s compartment.

      '
    properties:
      compartmentId:
        description: 'The OCID of the new compartment.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
  CreateAnalyticsInstanceDetails:
    description: 'Input payload to create an Anaytics instance.

      '
    properties:
      adminUser:
        description: 'The Analytics instance administrator user. This must be the
          user name (not OCID) of a user in the nominated identity domain. For example:
          john.smith@example.com.

          '
        maxLength: 255
        type: string
      capacity: *id002
      compartmentId: *id003
      definedTags: *id004
      description: *id005
      domainId:
        description: 'The OCID of the identity domain to use for the new Analytics
          instance. For example: ocid1.domain.oc1..ocid1.domain.oc1..aaaaaa111111bbbbbb222222cccccc333333dddddd444444eeeeee5555.

          '
        maxLength: 255
        type: string
      emailNotification: *id006
      featureBundle: *id019
      featureSet: *id007
      freeformTags: *id008
      idcsAccessToken:
        description: 'IDCS access token identifying a stripe and service administrator
          user.

          '
        maxLength: 8192
        type: string
      kmsKeyId: *id020
      licenseType: *id010
      name: *id012
      networkEndpointDetails: *id013
      updateChannel: *id021
    required:
    - name
    - compartmentId
    - capacity
    - featureSet
    - licenseType
  CreatePrivateAccessChannelDetails:
    description: 'Input payload to create a private access channel.

      '
    properties:
      displayName: &id032
        description: 'Display name of the private access channel.

          '
        maxLength: 32
        minLength: 1
        pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
        type: string
      networkSecurityGroupIds: &id033
        description: 'Network Security Group OCIDs for the Analytics instance.

          '
        items:
          maxLength: 255
          minLength: 1
          type: string
        maxLength: 5
        type: array
      privateSourceDnsZones: &id034
        description: "List of private source DNS zones registered with the private\
          \ access channel. The\n datasource hostnames from these DNS zones / domains\
          \ will be resolved in the peered VCN for access from  the Analytics instance.\n\
          Minimum 1 private source is required. Maximum 30 private source DNS zones\
          \ can be registered.\n"
        items:
          $ref: '#/definitions/PrivateSourceDnsZone'
        maxLength: 30
        minLength: 1
        type: array
      privateSourceScanHosts: &id035
        description: 'List of private source database SCAN hosts registered with the
          private access channel for access from the Analytics instance.

          '
        items:
          $ref: '#/definitions/PrivateSourceScanHost'
        maxLength: 15
        type: array
      subnetId: &id036
        description: 'OCID of the customer subnet connected to the private access
          channel.

          '
        maxLength: 255
        minLength: 1
        type: string
      vcnId: &id037
        description: 'OCID of the customer VCN peered with the private access channel.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - displayName
    - vcnId
    - subnetId
    - privateSourceDnsZones
    type: object
  CreateResourceGroupDetails:
    description: 'Input payload to create resource group.

      '
    properties:
      capacity: &id024
        description: The capacity (in OCPU's) to be allocated for this resource.
        minimum: 1
        type: integer
      description: &id025
        description: Optional description of the resource group
        maxLength: 512
        minLength: 0
        type: string
      displayName: &id026
        description: Meaningful name of resource group for end user
        maxLength: 255
        minLength: 1
        type: string
      resourceName: &id027
        description: Meaningful name of resource group for end user
        maxLength: 255
        minLength: 1
        type: string
    required:
    - resourceName
    - capacity
  CreateVanityUrlDetails:
    description: 'Input payload to create a vanity URL.

      '
    properties:
      caCertificate: &id040
        description: 'PEM CA certificates for HTTPS connections. This may include
          multiple PEM certificates.

          '
        minLength: 1
        type: string
      description: *id005
      hosts: &id044
        description: 'List of fully-qualified hostnames supported by this vanity URL
          definition (maximum of 3).

          '
        items:
          maxLength: 255
          minLength: 1
          type: string
        maxItems: 3
        minItems: 1
        type: array
      passphrase: &id041
        description: 'Passphrase for the PEM private key (if any).

          '
        type: string
      privateKey: &id042
        description: 'PEM private key for HTTPS connections.

          '
        minLength: 1
        type: string
      publicCertificate: &id043
        description: 'PEM certificate for HTTPS connections.

          '
        minLength: 1
        type: string
    required:
    - hosts
    - caCertificate
    - privateKey
    - publicCertificate
  Error:
    properties:
      code:
        description: 'A short error code that defines the error, for programmatic
          parsing. See

          [API Errors](/Content/API/References/apierrors.htm).

          '
        type: string
      message:
        description: 'A human-readable error string.

          '
        type: string
    required:
    - code
    - message
  FeatureBundle:
    description: 'Feature Bundle Enum.

      '
    enum: *id022
    type: string
  FeatureSet:
    description: 'Analytics feature set.

      '
    enum: *id023
    type: string
  InstanceResourceGroup:
    description: 'Resource Groups for Instance

      '
    properties: &id028
      capacity: *id024
      description: *id025
      displayName: *id026
      id:
        description: Unique identifier and name of resource group.  Must be unique
          within the instance
        maxLength: 255
        minLength: 1
        type: string
      resourceName: *id027
    required: &id029
    - id
    - resourceName
    - capacity
    type: object
  InstanceResourceGroupSummary:
    description: 'Resource Groups for Instance

      '
    properties: *id028
    required: *id029
    type: object
  LicenseType:
    description: 'The license type of the Analytics instance.

      '
    enum: *id030
    type: string
  NetworkEndpointDetails:
    description: 'Base representation of a network endpoint.

      '
    discriminator: networkEndpointType
    properties:
      networkEndpointType:
        description: 'The type of network endpoint.

          '
        enum: &id031
        - PUBLIC
        - PRIVATE
        type: string
        x-obmcs-top-level-enum: '#/definitions/NetworkEndpointType'
    required:
    - networkEndpointType
    type: object
  NetworkEndpointType:
    description: 'Public or private endpoint access type.

      '
    enum: *id031
    type: string
  PrivateAccessChannel:
    description: 'Analytics instance private access channel model.

      '
    properties:
      displayName: *id032
      egressSourceIpAddresses:
        description: 'List of IP addresses from the customer subnet connected to the
          private access channel, used as a source IP by the private access channel

          for network traffic from the Analytics instance to the private sources.

          '
        items:
          maxLength: 46
          minLength: 8
          type: string
        type: array
      ipAddress:
        description: 'IP address of the private access channel.

          '
        maxLength: 255
        minLength: 1
        type: string
      key:
        description: 'Private access channel unique identifier key.

          '
        maxLength: 255
        minLength: 1
        type: string
      networkSecurityGroupIds: *id033
      privateSourceDnsZones: *id034
      privateSourceScanHosts: *id035
      subnetId: *id036
      vcnId: *id037
    required:
    - key
    - displayName
    - vcnId
    - subnetId
    - ipAddress
    - egressSourceIpAddresses
  PrivateEndpointDetails:
    allOf:
    - $ref: '#/definitions/NetworkEndpointDetails'
    - discriminator: PRIVATE
      properties:
        networkSecurityGroupIds: *id033
        subnetId:
          description: 'The subnet OCID for the private endpoint.

            '
          maxLength: 255
          minLength: 1
          type: string
        vcnId:
          description: 'The VCN OCID for the private endpoint.

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - vcnId
      - subnetId
    description: 'Private endpoint configuration details.

      '
  PrivateSourceDnsZone:
    description: 'Private source DNS zone model.

      '
    properties:
      description:
        description: 'Description of the private source DNS zone.

          '
        maxLength: 255
        minLength: 0
        type: string
      dnsZone:
        description: 'Private source DNS zone. For example: example-vcn.oraclevcn.com,
          corp.example.com.

          '
        maxLength: 253
        minLength: 1
        type: string
    required:
    - dnsZone
  PrivateSourceScanHost:
    description: 'Private source SCAN hostname model.

      '
    properties:
      description:
        description: 'Description of private source SCAN host zone.

          '
        maxLength: 255
        minLength: 1
        type: string
      scanHostname:
        description: 'Private source SCAN hostname. For example: db01-scan.corp.example.com,
          prd-db01-scan.mycompany.com.

          '
        maxLength: 255
        minLength: 1
        type: string
      scanPort:
        description: 'Private source SCAN host port. This is the source port where
          the SCAN protocol connects (for example, 1521).

          '
        minimum: 1
        type: integer
    required:
    - scanHostname
    - scanPort
  PublicEndpointDetails:
    allOf:
    - $ref: '#/definitions/NetworkEndpointDetails'
    - discriminator: PUBLIC
      properties:
        whitelistedIps: &id045
          description: 'Source IP addresses or IP address ranges in ingress rules.

            '
          items:
            maxLength: 255
            minLength: 1
            type: string
          type: array
        whitelistedServices:
          description: 'Oracle Cloud services that are allowed to access this Analytics
            instance.

            '
          items:
            enum: *id038
            type: string
            x-obmcs-top-level-enum: '#/definitions/AccessControlServiceType'
          type: array
        whitelistedVcns:
          description: 'Virtual Cloud Networks allowed to access this network endpoint.

            '
          items:
            $ref: '#/definitions/VirtualCloudNetwork'
          type: array
    description: 'Public endpoint configuration details.

      '
  ResourceGroupSortBy:
    description: 'The field to sort by (one column only). Default sort order is

      default group first, then sort by resource name, ascending.

      '
    enum: &id057
    - id
    - resourceName
    - displayName
    - description
    - capacity
    - status
    type: string
  ScaleAnalyticsInstanceDetails:
    description: 'Input payload to scale an Analytics instance up or down.

      '
    properties:
      capacity: *id002
    required:
    - capacity
  SetFeatureBundleDetails:
    description: 'Input payload for the feature set of an Analytics instance.

      '
    properties:
      featureBundle: *id019
  SetKmsKeyDetails:
    description: 'Input payload to reset the OCI vault encryption key.

      '
    properties:
      kmsKeyId:
        description: 'OCID of the OCI vault key encrypting the customer data stored
          in this Analytics instance. An empty value indicates the default Oracle-managed
          encryption (this API doesn''t support null).

          '
        maxLength: 255
        minLength: 0
        type: string
    required:
    - kmsKeyId
  SortBy:
    description: 'The field to sort by (one column only). Default sort order is

      ascending, except for the `timeCreated` column which is descending.

      '
    enum: &id058
    - capacityType
    - capacityValue
    - featureSet
    - lifecycleState
    - name
    - timeCreated
    type: string
  SortOrder:
    description: 'The sort order to use, either ascending (`ASC`) or descending (`DESC`).

      '
    enum: &id059
    - ASC
    - DESC
    type: string
  UpdateAnalyticsInstanceDetails:
    description: 'Input payload to update an Analytics instance. Fields that aren''t
      provided

      won''t be updated.

      '
    properties:
      definedTags: *id004
      description: *id005
      emailNotification: *id006
      freeformTags: *id008
      licenseType: *id010
      updateChannel: *id021
  UpdateChannel:
    description: "EARLY - Early update cycle. Oracle delivers updates as soon as they're\
      \ available. \nREGULAR - Regular update cycle. Oracle delivers updates a few\
      \ weeks after completing the early update cycle. \nPHASE_1 - Reserved for future\
      \ use. \nPHASE_2 - Reserved for future use.\n"
    enum: *id039
    type: string
  UpdatePrivateAccessChannelDetails:
    description: 'Input payload to update a private access channel.

      '
    properties:
      displayName: *id032
      networkSecurityGroupIds: *id033
      privateSourceDnsZones: *id034
      privateSourceScanHosts: *id035
      subnetId: *id036
      vcnId: *id037
    type: object
  UpdateResourceGroupDetails:
    description: 'Input payload to update a resource group.

      '
    properties:
      capacity: *id024
      description: *id025
      displayName: *id026
      resourceName: *id027
    required:
    - resourceName
    - capacity
  UpdateVanityUrlDetails:
    description: 'Input payload to update a vanity URL.

      '
    properties:
      caCertificate: *id040
      passphrase: *id041
      privateKey: *id042
      publicCertificate: *id043
    required:
    - caCertificate
    - privateKey
    - publicCertificate
  VanityUrlDetails:
    description: 'Vanity URL configuration details.

      '
    properties:
      description:
        description: 'Description of the vanity URL.

          '
        maxLength: 512
        minLength: 1
        type: string
      hosts: *id044
      key:
        description: 'The vanity URL unique identifier key.

          '
        maxLength: 255
        minLength: 1
        type: string
      publicCertificate: *id043
      urls:
        description: 'List of URLs supported by this vanity URL definition (maximum
          of 3).

          '
        items:
          maxLength: 255
          minLength: 1
          type: string
        maxItems: 3
        minItems: 1
        type: array
    type: object
  VirtualCloudNetwork:
    description: 'Virtual Cloud Network definition.

      '
    properties:
      id:
        description: 'The Virtual Cloud Network OCID.

          '
        maxLength: 255
        minLength: 1
        type: string
      whitelistedIps: *id045
    required:
    - id
    type: object
  WorkRequest:
    description: 'An asynchronous work request.

      '
    properties:
      compartmentId: &id050
        description: 'The compartment OCID of this work request.

          '
        maxLength: 255
        minLength: 1
        type: string
      id: *id009
      operationType: &id051
        description: 'The operation performed by the work request.

          '
        enum: &id046
        - CREATE_ANALYTICS_INSTANCE
        - DELETE_ANALYTICS_INSTANCE
        - START_ANALYTICS_INSTANCE
        - STOP_ANALYTICS_INSTANCE
        - SCALE_ANALYTICS_INSTANCE
        - CHANGE_ANALYTICS_INSTANCE_COMPARTMENT
        - CHANGE_ANALYTICS_INSTANCE_NETWORK_ENDPOINT
        - CREATE_VANITY_URL
        - UPDATE_VANITY_URL
        - DELETE_VANITY_URL
        - CREATE_PRIVATE_ACCESS_CHANNEL
        - UPDATE_PRIVATE_ACCESS_CHANNEL
        - DELETE_PRIVATE_ACCESS_CHANNEL
        - UPDATE_INSTANCE_ENCRYPTION_KEY
        - CREATE_RESOURCE_GROUP
        - UPDATE_RESOURCE_GROUP
        - DELETE_RESOURCE_GROUP
        - SET_FEATURE_SET
        type: string
        x-obmcs-top-level-enum: '#/definitions/WorkRequestOperationType'
      percentComplete:
        description: 'Percentage of the request completed.

          '
        format: float
        type: number
      resources: &id052
        description: 'The resources this work request affects.

          '
        items:
          $ref: '#/definitions/WorkRequestResource'
        type: array
      status: &id053
        description: 'The current status of the work request.

          '
        enum: &id049
        - ACCEPTED
        - IN_PROGRESS
        - FAILED
        - SUCCEEDED
        - CANCELING
        - CANCELED
        type: string
        x-obmcs-top-level-enum: '#/definitions/WorkRequestStatus'
      timeAccepted: &id054
        description: 'The time the work request was accepted, in the format defined
          by RFC3339.


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      timeFinished: &id055
        description: 'The time the work request was finished, in the format defined
          by RFC3339.


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      timeStarted: &id056
        description: 'The time the work request was started, in the format defined
          by RFC3339.


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
    required:
    - id
    - operationType
    - status
    - compartmentId
    - resources
    - percentComplete
    - timeAccepted
    type: object
  WorkRequestActionResult:
    description: 'The way in which a resource was affected by a work request.

      '
    enum: &id047
    - COMPARTMENT_CHANGED
    - CREATED
    - DELETED
    - STARTED
    - STOPPED
    - SCALED
    - NETWORK_ENDPOINT_CHANGED
    - VANITY_URL_CREATED
    - VANITY_URL_UPDATED
    - VANITY_URL_DELETED
    - PRIVATE_ACCESS_CHANNEL_CREATED
    - PRIVATE_ACCESS_CHANNEL_UPDATED
