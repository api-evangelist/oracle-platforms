      x-example: "PUT /20160918/clusterNetworks/<var>&lt;cluster_network_OCID&gt;</var>\nHost: iaas.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"displayName\": \"example_cluster_network\"\n}\n"
