      x-example: "​POST /20160918/clusterNetworks/<var>&lt;cluster_network_OCID&gt;</var>/actions/changeCompartment\nHost: iaas.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..<var>&lt;cluster_network_OCID&gt;</var>\",\n}\n"
