      summary: CreateInstanceConfiguration
      tags:
      - computeManagement
      x-example: "Example 1: Create an instance configuration by providing a list of configuration settings\nPOST /20160918/instanceConfigurations\nHost: iaas.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..<var>&lt;unique_ID&gt;</var>\",\n  \"displayName\": \"example-instance-configuration\",\n  \"source\": \"NONE\",\n  \"instanceDetails\" : {\n    \"instanceType\": \"compute\",\n    \"blockVolumes\" : [ {\n      //Optional parameters for creating or attaching block volumes\n    } ],\n    \"launchDetails\" : {\n      \"compartmentId\":\"ocid1.tenancy.oc1..<var>&lt;unique_ID&gt;</var>\",\n      \"shape\":\"VM.Standard2.1\",\n      \"sourceDetails\": {\n          \"sourceType\": \"image\",\n          \"imageId\": \"oci.image.oc1.phx.<var>&lt;unique_ID&gt;</var>\"\n      },\n      //Optional parameters for configuring settings such as\n      //the availability domain, primary VNIC, and instance metadata\n    },\n    \"secondaryVnics\" : [ {\n      //Optional parameters for attaching secondary VNICs\n    } ]\n  }\n}\n\nExample 2: Create an instance configuration using an existing instance as a template\nPOST /20160918/instanceConfigurations\nHost: iaas.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..<var>&lt;unique_ID&gt;</var>\",\n  \"displayName\": \"example-instance-configuration\",\n  \"source\": \"INSTANCE\",\n  \"instanceId\" : \"ocid1.instance.oc1.phx.<var>&lt;unique_ID&gt;</var>\"\n}\n"
      requestBody:
        content:
          application/json:
