        200:
          description: A page of OceInstanceSummary objects.
          headers:
            opc-next-page:
              description: 'For pagination of a list of `OceInstance`s. If this header appears in the response, then this

                is a partial list of OceInstances. Include this value as the `page` parameter in a subsequent

                GET request to get the next batch of OceInstances.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If

                you need to contact Oracle about a particular request,

                please provide the request ID.

