paths:
  /oceInstances:
    get:
      description: 'Returns a list of OceInstances.

        '
      operationId: ListOceInstances
      parameters:
      - $ref: '#/components/parameters/TenancyIdQueryParam'
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
