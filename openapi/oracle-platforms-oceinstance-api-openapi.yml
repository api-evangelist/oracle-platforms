      x-related-resource: '#/definitions/OceInstance'
    get:
      description: Gets a OceInstance by identifier
      operationId: GetOceInstance
      parameters:
      - $ref: '#/components/parameters/OceInstanceIdentifierPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: Retrieves the OceInstance with the given id
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
