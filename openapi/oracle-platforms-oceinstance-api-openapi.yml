components:
  schemas:
    WorkflowStep:
      description: Workflow step of workflow monitor.
      properties:
        status:
          description: workflow step status
          type: string
        stepName:
          description: workflow step name
          type: string
    WorkRequestError:
      description: An error encountered while executing a work request.
      properties:
        code:
          description: 'A machine-usable code for the error that occured. Error codes are listed on

            (https://docs.us-phoenix-1.oraclecloud.com/Content/API/References/apierrors.htm)

            '
          type: string
        message:
          description: A human readable description of the issue encountered.
          type: string
        timestamp:
          description: The time the error occured. An RFC3339 formatted datetime string.
          format: date-time
          type: string
      required:
      - code
      - message
      - timestamp
    WorkRequest:
      description: A description of workrequest status
      properties:
        compartmentId:
          description: 'The ocid of the compartment that contains the work request. Work requests should be scoped to

            the same compartment as the resource the work request affects. If the work request affects multiple resources,

            and those resources are not in the same compartment, it is up to the service team to pick the primary

            resource whose compartment should be used

            '
          type: string
        id:
          description: The id of the work request.
          type: string
        operationType:
          description: type of the work request
          enum:
          - CREATE_OCE_INSTANCE
          - UPDATE_OCE_INSTANCE
          - DELETE_OCE_INSTANCE
          type: string
        percentComplete:
          description: Percentage of the request completed.
          format: float
          type: number
        resources:
          description: The resources affected by this work request.
          items:
            $ref: '#/components/schemas/WorkRequestResource'
          type: array
        status:
          description: status of current work request.
          enum:
          - ACCEPTED
          - IN_PROGRESS
          - FAILED
          - SUCCEEDED
          - CANCELING
          - CANCELED
          type: string
        timeAccepted:
          description: 'The date and time the request was created, as described in

            [RFC 3339](https://tools.ietf.org/rfc/rfc3339), section 14.29.

            '
          format: date-time
          type: string
        timeFinished:
          description: 'The date and time the object was finished, as described in [RFC 3339](https://tools.ietf.org/rfc/rfc3339).

            '
          format: date-time
          type: string
        timeStarted:
          description: 'The date and time the request was started, as described in [RFC 3339](https://tools.ietf.org/rfc/rfc3339),

            section 14.29.

            '
          format: date-time
          type: string
        workflowMonitor:
          $ref: '#/components/schemas/WorkflowMonitor'
      required:
      - operationType
      - status
      - id
      - compartmentId
      - resources
      - percentComplete
      - timeAccepted
    CreateOceInstanceDetails:
      description: The information about new OceInstance.
      properties:
        adminEmail:
          description: Admin Email for Notification
          type: string
        compartmentId:
          description: Compartment Identifier
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Usage of predefined tag keys. These predefined keys are scoped to namespaces.

            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          type: object
        description:
          description: OceInstance description
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
        idcsAccessToken:
          description: Identity Cloud Service access token identifying a stripe and service administrator user
          type: string
        identityStripe:
          $ref: '#/components/schemas/IdentityStripeDetails'
        instanceAccessType:
          description: Flag indicating whether the instance access is private or public
          enum:
          - PUBLIC
          - PRIVATE
          type: string
        instanceLicenseType:
          description: Flag indicating whether the instance license is new cloud or bring your own license
          enum:
          - NEW
          - BYOL
          - PREMIUM
          - STARTER
          type: string
          x-obmcs-top-level-enum: '#/definitions/LicenseType'
        instanceUsageType:
          description: Instance type based on its usage
          enum:
          - PRIMARY
          - NONPRIMARY
          type: string
        name:
          description: OceInstance Name
          type: string
        objectStorageNamespace:
          description: Object Storage Namespace of Tenancy
          type: string
        tenancyId:
          description: Tenancy Identifier
          type: string
        tenancyName:
          description: Tenancy Name
          type: string
        upgradeSchedule:
          description: 'Upgrade schedule type representing service to be upgraded immediately whenever latest version is released

            or delay upgrade of the service to previous released version

            '
          type: string
          x-obmcs-enumref: '#/definitions/OceInstance/upgradeSchedule'
        wafPrimaryDomain:
          description: Web Application Firewall(WAF) primary domain
          type: string
      required:
      - compartmentId
      - name
      - tenancyId
      - idcsAccessToken
      - tenancyName
      - objectStorageNamespace
      - adminEmail
      type: object
    UpdateOceInstanceDetails:
      description: The information to be updated.
      properties:
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Usage of predefined tag keys. These predefined keys are scoped to namespaces.

            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          type: object
        description:
          description: OceInstance description
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
        instanceLicenseType:
          description: Flag indicating whether the instance license is new cloud or bring your own license
          enum:
          - NEW
          - BYOL
          - PREMIUM
          - STARTER
          type: string
          x-obmcs-top-level-enum: '#/definitions/LicenseType'
        instanceUsageType:
          description: Instance type based on its usage
          enum:
          - PRIMARY
          - NONPRIMARY
          type: string
        wafPrimaryDomain:
          description: Web Application Firewall(WAF) primary domain
          type: string
      type: object
    IdentityStripeDetails:
      description: Details of the identity stripe used for OceInstance
      properties:
        serviceName:
          description: 'Name of the Identity Cloud Service instance in My Services to be used.

            Example: `secondstripe`

            '
          type: string
        tenancy:
          description: 'Value of the Identity Cloud Service tenancy.

            Example: `idcs-8416ebdd0d674f84803f4193cce026e9`

            '
          type: string
      required:
      - serviceName
      - tenancy
    OceInstanceSummary:
      description: Summary of the OceInstance.
      properties:
        adminEmail:
          description: Admin Email for Notification
          type: string
        compartmentId:
          description: Compartment Identifier
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Usage of predefined tag keys. These predefined keys are scoped to namespaces.

            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          type: object
        description:
          description: OceInstance description, can be updated
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
        guid:
          description: Unique GUID identifier that is immutable on creation
          type: string
        id:
          description: Unique identifier that is immutable on creation
          type: string
        idcsTenancy:
          description: IDCS Tenancy Identifier
          type: string
        instanceAccessType:
          description: Flag indicating whether the instance access is private or public
          enum:
          - PUBLIC
          - PRIVATE
          type: string
        instanceLicenseType:
          description: Flag indicating whether the instance license is new cloud or bring your own license
          enum:
          - NEW
          - BYOL
          - PREMIUM
          - STARTER
          type: string
          x-obmcs-top-level-enum: '#/definitions/LicenseType'
        instanceUsageType:
