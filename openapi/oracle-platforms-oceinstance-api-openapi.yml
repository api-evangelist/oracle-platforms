          description: Accepted the request. The OceInstance will be updated.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If

                you need to contact Oracle about a particular request,

                please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Update the OceInstance identified by the id
      tags:
      - oceInstance
      x-related-resource: '#/definitions/OceInstance'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOceInstanceDetails'
        description: The information to be updated.
        required: true
  /oceInstances/{oceInstanceId}/actions/changeCompartment:
    post:
      description: Moves a OceInstance into a different compartment
      operationId: ChangeOceInstanceCompartment
      parameters:
