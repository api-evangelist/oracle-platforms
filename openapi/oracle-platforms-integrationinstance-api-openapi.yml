components:
  parameters:
    PaginationTokenQueryParam:
      description: The page token representing the page at which to start retrieving results. This is usually retrieved from a previous list call.
      in: query
      name: page
      schema:
        type: string
        maxLength: 1024
        minLength: 1
    WorkRequestIdPathParam:
      description: The ID of the asynchronous request.
      in: path
      name: workRequestId
      required: true
      schema:
        type: string
    RetryTokenHeader:
      description: 'A token that uniquely identifies a request so it can be retried in case

        of a timeout or server error without risk of executing that same action

        again. Retry tokens expire after 24 hours, but can be invalidated before

        then due to conflicting operations. For example, if a resource has been

        deleted and purged from the system, then a retry of the original creation

        request might be rejected.

        '
      in: header
      name: opc-retry-token
      required: false
      schema:
        type: string
        maxLength: 64
        minLength: 1
    DisplayNameQueryParam:
      description: 'A user-friendly name. Does not have to be unique, and it''s changeable.


        Example: `My new resource`

        '
      in: query
      name: displayName
      schema:
        type: string
        maxLength: 255
        minLength: 1
    SortOrderQueryParam:
      description: The sort order to use, either 'asc' or 'desc'.
      in: query
      name: sortOrder
      schema:
        type: string
        enum:
        - ASC
        - DESC
        default: ASC
    PaginationLimitQueryParam:
      description: The maximum number of items to return.
      in: query
      name: limit
      schema:
        type: integer
        default: 10
        maximum: 1000
        minimum: 1
    SortByQueryParam:
      description: 'The field to sort by. Only one sort order may be provided. Default order

        for TIMECREATED is descending. Default order for DISPLAYNAME is

        ascending. If no value is specified TIMECREATED is default.

        '
      in: query
      name: sortBy
      schema:
        type: string
        enum:
        - TIMECREATED
        - DISPLAYNAME
        default: TIMECREATED
    IntegrationInstanceIdentifierQueryParam:
      description: The Integration Instance identifier to use to filter results
      in: query
      name: integrationInstanceId
      schema:
        type: string
    CompartmentIdQueryParam:
      description: The ID of the compartment in which to list resources.
      in: query
      name: compartmentId
      required: true
      schema:
        type: string
    RequestIdHeader:
      description: The client request ID for tracing.
      in: header
      name: opc-request-id
      schema:
        type: string
    LifecycleStateQueryParam:
      description: Life cycle state to query on.
      in: query
      name: lifecycleState
      schema:
        type: string
        enum:
        - CREATING
        - UPDATING
        - ACTIVE
        - INACTIVE
        - DELETING
        - DELETED
        - FAILED
    IntegrationInstanceIdentifierPathParam:
      description: Unique Integration Instance identifier.
      in: path
      name: integrationInstanceId
      required: true
      schema:
        type: string
    IfMatchHeader:
      description: 'For optimistic concurrency control. In the PUT or DELETE call

        for a resource, set the `if-match` parameter to the value of the

        etag from a previous GET or POST response for that resource.

        The resource will be updated or deleted only if the etag you

        provide matches the resource''s current etag value.

        '
      in: header
      name: if-match
      required: false
      schema:
        type: string
  schemas:
    CustomEndpointDetails:
      description: Details for a custom endpoint for the integration instance.
      properties:
        alias:
          description: 'When creating the DNS CNAME record for the custom hostname, this value must be specified in the rdata.

            '
          format: hostname
          type: string
        certificateSecretId:
          description: 'Optional OCID of a vault/secret containing a private SSL certificate bundle to be used for the custom hostname.

            '
          type: string
        certificateSecretVersion:
          description: 'The secret version used for the certificate-secret-id (if certificate-secret-id is specified).

            '
          type: integer
        dnsType:
          description: Type of DNS.
          enum:
          - OCI
          type: string
        dnsZoneName:
          description: DNS Zone name
          type: string
        hostname:
          description: A custom hostname to be used for the integration instance URL, in FQDN format.
          format: hostname
          type: string
        managedType:
          description: Indicates if custom endpoint is managed by oracle or customer.
          enum:
          - ORACLE_MANAGED
          - CUSTOMER_MANAGED
          type: string
      required:
      - hostname
      type: object
    CreateCustomEndpointDetails:
      description: Details for a custom endpoint for the integration instance (update).
      properties:
        certificateSecretId:
          description: 'Optional OCID of a vault/secret containing a private SSL certificate bundle to be used for the custom hostname.

            All certificates should be stored in a single base64 encoded secret

            Note the update will fail if this is not a valid certificate.

            '
          type: string
        hostname:
          description: A custom hostname to be used for the integration instance URL, in FQDN format.
          format: hostname
          type: string
      required:
      - hostname
      type: object
    AttachmentDetails:
      description: Description of an attachments for this instance
      properties:
        isImplicit:
          description: '* If role == `PARENT`, the attached instance was created by this service instance

            * If role == `CHILD`, this instance was created from attached instance on behalf of a user

            '
          type: boolean
        targetId:
          description: The OCID of the target instance (which could be any other OCI PaaS/SaaS resource), to which this instance is attached.
          type: string
        targetInstanceUrl:
          description: The dataplane instance URL of the attached instance
          type: string
        targetRole:
          description: "The role of the target attachment.\n   * `PARENT` - The target instance is the parent of this attachment.\n   * `CHILD` - The target instance is the child of this attachment.\n"
          enum:
          - PARENT
          - CHILD
          type: string
        targetServiceType:
          description: The type of the target instance, such as "FUSION".
          type: string
      required:
      - targetRole
      - isImplicit
      - targetId
      - targetInstanceUrl
      - targetServiceType
      type: object
    Error:
      description: Error Information.
      properties:
        code:
          description: A short error code that defines the error, meant for programmatic parsing.
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
      - code
      - message
    NetworkEndpointDetails:
      description: 'Base representation of a network endpoint.

        '
      discriminator:
        propertyName: networkEndpointType
      properties:
        networkEndpointType:
          description: 'The type of network endpoint.

            '
          enum:
          - PUBLIC
          type: string
          x-obmcs-top-level-enum: '#/definitions/NetworkEndpointType'
      required:
      - networkEndpointType
      type: object
    ExtendDataRetentionDetails:
      description: Details for extending data retention for given integration instance
      properties:
        dataRetentionPeriod:
          description: Data retention period set for given integration instance
          enum:
          - MONTHS_1
          - MONTHS_3
          - MONTHS_6
          type: string
      required:
      - dataRetentionPeriod
      type: object
    WorkRequestLogEntry:
      description: Log entries related to a specific work request.
      properties:
        message:
          description: The description of an action that occurred.
          example: error validating payload
          type: string
        timestamp:
          description: The date and time the log entry occurred.
          example: '2017-07-21T16:11:29Z'
          format: date-time
          type: string
      required:
      - message
      - timestamp
      type: object
    WorkRequest:
      description: A description of work request status.
      properties:
        compartmentId:
          description: 'The ocid of the compartment that contains the work request. Work

            requests should be scoped to the same compartment as the resource the

            work request affects. If the work request affects multiple resources,

            and those resources are not in the same compartment, it is up to the

            service team to pick the primary resource whose compartment should be

            used.

            '
          type: string
        id:
          description: The id of the work request.
          type: string
        operationType:
          description: Type of the work request.
          enum:
          - CREATE_INTEGRATION_INSTANCE
          - UPDATE_INTEGRATION_INSTANCE
          - STOP_INTEGRATION_INSTANCE
          - START_INTEGRATION_INSTANCE
          - DELETE_INTEGRATION_INSTANCE
          - CHANGE_PRIVATE_ENDPOINT_OUTBOUND_CONNECTION
          - ENABLE_PROCESS_AUTOMATION
          - DISABLE_PROCESS_AUTOMATION
          - ADD_LOG_ANALYTICS_LOG_GROUP
          - DELETE_LOG_ANALYTICS_LOG_GROUP
          - CONVERT_INSTANCE
          - EXTEND_DATA_RETENTION
          - DISASTER_RECOVERY_FAILOVER
          - CREATE_CUSTOM_ENDPOINT
          - DELETE_CUSTOM_ENDPOINT
          type: string
        percentComplete:
          description: Percentage of the request completed.
          format: float
          type: number
        resources:
          description: The resources affected by this work request.
          items:
            $ref: '#/components/schemas/WorkRequestResource'
          type: array
        status:
          description: Status of current work request.
          enum:
          - ACCEPTED
          - IN_PROGRESS
          - FAILED
          - SUCCEEDED
          - CANCELING
          - CANCELED
          type: string
        timeAccepted:
          description: 'The date and time the request was created, as described in

            [RFC 3339](https://tools.ietf.org/rfc/rfc3339), section 14.29.

            '
          format: date-time
          type: string
        timeFinished:
          description: 'The date and time the object was finished, as described in

            [RFC 3339](https://tools.ietf.org/rfc/rfc3339).

            '
          format: date-time
          type: string
        timeStarted:
          description: 'The date and time the request was started, as described in

            [RFC 3339](https://tools.ietf.org/rfc/rfc3339),

            section 14.29.

            '
          format: date-time
          type: string
      required:
      - operationType
      - status
      - id
      - compartmentId
      - resources
      - percentComplete
      - timeAccepted
    ChangeIntegrationInstanceNetworkEndpointDetails:
      description: 'Input payload to update an Integration instance endpoint details. An empty payload will clear out any existing configuration.


        Some actions may not be applicable to specific integration types,

        see [Differences in Instance Management](https://www.oracle.com/pls/topic/lookup?ctx=en/cloud/paas/application-integration&id=INTOO-GUID-931B5E33-4FE6-4997-93E5-8748516F46AA__GUID-176E43D5-4116-4828-8120-B929DF2A6B5E)

        for details.

        '
      properties:
        networkEndpointDetails:
          $ref: '#/components/schemas/NetworkEndpointDetails'
    AddLogAnalyticsLogGroupDetails:
      description: 'Input payload to ADD Log Analytics Log Group for given IntegrationInstance.

        Some actions may not be applicable to specific integration types.

        '
      properties:
        logGroupId:
          description: Log Group ocid.
          type: string
      required:
      - logGroupId
      type: object
    IntegrationInstanceSummary:
      description: Summary of the Integration Instance.
      properties:
        alternateCustomEndpoints:
          description: 'A list of alternate custom endpoints used for the integration instance URL.

            '
          items:
            $ref: '#/components/schemas/CustomEndpointDetails'
          type: array
        compartmentId:
          description: Compartment Identifier.
          type: string
        consumptionModel:
          description: The entitlement used for billing purposes.
          enum:
          - UCM
          - GOV
          - OIC4SAAS
          type: string
        customEndpoint:
          $ref: '#/components/schemas/CustomEndpointDetails'
        dataRetentionPeriod:
          description: Data retention period set for given integration instance
          enum:
          - MONTHS_1
          - MONTHS_3
          - MONTHS_6
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are

                supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped

              to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Usage of predefined tag keys. These predefined keys are scoped to

            namespaces.

            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          type: object
        displayName:
          description: Integration Instance Identifier, can be renamed.
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name,

            type or scope. Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
        id:
          description: Unique identifier that is immutable on creation.
          type: string
        instanceDesignTimeUrl:
          description: The Integration Instance Design Time URL
          type: string
        instanceUrl:
          description: The Integration Instance URL.
          type: string
        integrationInstanceType:
          description: 'Standard or Enterprise type,

            Oracle Integration Generation 2 uses ENTERPRISE and STANDARD,

            Oracle Integration 3 uses ENTERPRISEX and STANDARDX

            '
          enum:
          - STANDARD
          - ENTERPRISE
          - STANDARDX
          - ENTERPRISEX
          - HEALTHCARE
          type: string
        isByol:
          description: Bring your own license.
          type: boolean
        isDisasterRecoveryEnabled:
          description: Is Disaster Recovery enabled for the integrationInstance
          type: boolean
        isFileServerEnabled:
          description: The file server is enabled or not.
          type: boolean
        isVisualBuilderEnabled:
          description: Visual Builder is enabled or not.
          type: boolean
        lifecycleDetails:
          description: Additional details of lifecycleState or substates
          type: string
        lifecycleState:
          description: The current state of the Integration Instance.
          enum:
          - CREATING
          - UPDATING
          - ACTIVE
          - INACTIVE
          - DELETING
          - DELETED
          - FAILED
          type: string
        logGroupId:
          description: OCID of LogAnalytics LogGroup, enabled for given integration instance
