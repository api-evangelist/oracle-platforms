            \ for the alarm. The Alarms feature of\nthe Monitoring service interprets\
            \ results for each returned time series as Boolean values,\nwhere zero\
            \ represents false and a non-zero value represents true. A true value\
            \ means that the trigger\nrule condition has been met. The query must\
            \ specify a metric, statistic, interval, and trigger\nrule (threshold\
            \ or absence). Supported values for interval: `1m`-`60m` (also `1h`).\
            \ You can optionally\nspecify dimensions and grouping functions. Supported\
            \ grouping functions: `grouping()`, `groupBy()`.\n\nExample of threshold\
            \ alarm:\n\n  -----\n\n    CPUUtilization[1m]{resourceId = \"MODEL_DEPLOYMENT_OCID\"\
            }.grouping().mean() < 25\n    CPUUtilization[1m]{resourceId = \"MODEL_DEPLOYMENT_OCID\"\
