  ManagedComputeClusterWorkloadMetricExpressionRule:
    description: The metric expression rule base for workload scaling.
    discriminator: metricExpressionRuleType
    properties:
      metricExpressionRuleType:
        description: The metric expression for creating the alarm used to trigger
          autoscaling actions for workload.
        enum:
        - TARGET_PREDEFINED_EXPRESSION
        - TARGET_CUSTOM_EXPRESSION
        type: string
