  AutoScalingPolicy:
    allOf:
    - $ref: '#/definitions/ScalingPolicy'
    - discriminator: AUTOSCALING
      properties:
        autoScalingPolicies:
          description: 'The list of autoscaling policy details.

            '
          items:
            $ref: '#/definitions/AutoScalingPolicyDetails'
          maxItems: 1
          minItems: 1
          type: array
        coolDownInSeconds:
          description: 'For threshold-based autoscaling policies, this value is the
            minimum period of time to wait between scaling actions.

            The cooldown period gives the system time to stabilize before rescaling.
            The minimum value is 300 seconds, which

            is also the default. The cooldown period starts when the model deployment
            becomes ACTIVE after the scaling operation.

            '
          minimum: 300
          type: integer
        isEnabled:
          default: true
          description: Whether the autoscaling policy is enabled.
          type: boolean
      required:
      - autoScalingPolicies
