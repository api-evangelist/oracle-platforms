          to have any name but most resources have name exposed as 'name' or 'displayName'
          field).
        maxLength: 255
        minLength: 1
        type: string
      type:
        description: Type of application component
        enum:
        - DATA_SCIENCE_PIPELINE
        - DATA_SCIENCE_JOB
        - DATA_SCIENCE_MODEL
        - DATA_FLOW_APPLICATION
