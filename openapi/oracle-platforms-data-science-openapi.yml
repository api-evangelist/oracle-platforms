  ManagedComputeClusterWorkloadScalePolicy:
    description: Workload scaling policy configuration for workloads on managed compute
      cluster type compute target
    properties:
      coolDownInSeconds:
        default: 300
        description: "This value is the duration of time window used to restrict the\
          \ flapping of instance count when the metrics used for scaling keep fluctuating.\
          \ \nThis window is used to infer a previous desired state and avoid unwanted\
          \ changes to workload scale. Default value is 300 seconds.\n"
        maximum: 3600
        minimum: 0
        type: integer
      instanceCountAdjustment:
        default: 1
        description: The value is used for adjusting the count of instances by.
        minimum: 1
        type: integer
      pendingDuration:
        default: PT3M
        description: 'The period of time that the condition defined in the alarm must
          persist before the alarm state changes from "OK" to "FIRING"

          or vice versa. For example, a value of 5 minutes means that the alarm must
          persist in breaching the condition for five minutes

          before the alarm updates its state to "FIRING"; likewise, the alarm must
          persist in not breaching the condition for five minutes

          before the alarm updates its state to "OK." The duration is specified as
          a string in ISO 8601 format (PT10M for ten minutes).

          Minimum: PT1M. Maximum: PT30M. Default: PT3M.

          '
        maxLength: 100
        minLength: 1
        type: string
  ManagedComputeClusterWorkloadScalingPolicy:
