    - discriminator: THRESHOLD
      properties:
        threshold:
          description: A metric value at which the scaling operation will be triggered.
          minimum: 0
          type: integer
      required:
      - threshold
    description: The scaling configuration for the predefined metric expression rule.
  ManagedComputeClusterPredefinedMetricExpressionRule:
    allOf:
    - $ref: '#/definitions/ManagedComputeClusterMetricExpressionRule'
    - discriminator: PREDEFINED_EXPRESSION
      properties:
        metricType:
          description: Metric type
          enum:
          - CPU_UTILIZATION
          - MEMORY_UTILIZATION
          type: string
        scaleInConfiguration:
          $ref: '#/definitions/ManagedComputeClusterPredefinedExpressionThresholdScalingConfiguration'
        scaleOutConfiguration:
          $ref: '#/definitions/ManagedComputeClusterPredefinedExpressionThresholdScalingConfiguration'
      required:
      - metricType
      - scaleInConfiguration
      - scaleOutConfiguration
    description: An expression built using CPU or Memory metrics for triggering an
      autoscaling action on the managed compute cluster type compute target .
  ManagedComputeClusterScalingConfiguration:
    description: Scaling configuration for the metric expression rule.
    discriminator: scalingConfigurationType
    properties:
      instanceCountAdjustment:
        default: 1
        description: The value is used for adjusting the count of instances by.
        minimum: 1
        type: integer
      pendingDuration:
        default: PT3M
        description: 'The period of time that the condition defined in the alarm must
          persist before the alarm state changes from "OK" to "FIRING"

          or vice versa. For example, a value of 5 minutes means that the alarm must
          persist in breaching the condition for five minutes

          before the alarm updates its state to "FIRING"; likewise, the alarm must
          persist in not breaching the condition for five minutes

          before the alarm updates its state to "OK." The duration is specified as
          a string in ISO 8601 format (PT10M for ten minutes or

          PT1H for one hour). Minimum: PT3M. Maximum: PT1H. Default: PT3M.

          '
        maxLength: 100
        minLength: 1
        type: string
      scalingConfigurationType:
        description: The type of scaling configuration.
        enum:
        - THRESHOLD
        - QUERY
        type: string
    required:
    - scalingConfigurationType
  ManagedComputeClusterScalingPolicy:
    default:
      instanceCount: 1
      policyType: FIXED_SIZE
    description: The scaling policy to apply to managed compute cluster type compute
      target.
    discriminator: policyType
    properties:
      policyType:
        description: The type of scaling policy.
        enum:
        - FIXED_SIZE
        - AUTOSCALING
        type: string
    required:
    - policyType
  ManagedComputeClusterSystemData:
    allOf:
    - $ref: '#/definitions/ComputeTargetSystemData'
    - discriminator: MANAGED_COMPUTE_CLUSTER
      properties:
        currentInstanceCount:
          description: Current count of the instances in managed compute cluster type
            compute target.
          type: integer
    description: Managed compute cluster system data.
    type: object
  ManagedComputeClusterThresholdBasedAutoScalingPolicyDetails:
    allOf:
    - $ref: '#/definitions/ManagedComputeClusterAutoScalingPolicyDetails'
    - discriminator: THRESHOLD
      properties:
        initialInstanceCount:
          description: 'For a threshold-based autoscaling policy, this value is the
            initial number of instances to launch in the managed compute cluster type
            compute target

            immediately after autoscaling is enabled. Note that anytime this value
            is updated, the number of instances will be reset

            to this value. After autoscaling retrieves performance metrics, the number
            of instances is automatically adjusted from this

            initial number to a number that is based on the limits that you set.

            '
          minimum: 0
          type: integer
        maximumInstanceCount:
          description: For a threshold-based autoscaling policy, this value is the
            maximum number of instances the managed compute cluster type compute target
            is allowed to increase to (scale out).
          minimum: 2
          type: integer
        minimumInstanceCount:
          description: For a threshold-based autoscaling policy, this value is the
            minimum number of instances the managed compute cluster type compute target
            is allowed to decrease to (scale in).
          minimum: 0
          type: integer
        rules:
          description: The list of autoscaling policy rules.
          items:
            $ref: '#/definitions/ManagedComputeClusterMetricExpressionRule'
          maxItems: 1
          minItems: 1
          type: array
      required:
      - rules
      - initialInstanceCount
      - minimumInstanceCount
      - maximumInstanceCount
    description: Details for a threshold-based autoscaling policy to enable on the
      managed compute cluster type compute target . In a threshold-based autoscaling
      policy, an autoscaling action is triggered when a performance metric meets or
      exceeds a threshold.
    type: object
