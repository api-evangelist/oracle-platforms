paths:
  /oceInstances:
    get:
      description: 'Returns a list of OceInstances.

        '
      operationId: ListOceInstances
      parameters:
      - $ref: '#/parameters/TenancyIdQueryParam'
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/LifecycleStateQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of OceInstanceSummary objects.
          headers:
            opc-next-page:
              description: 'For pagination of a list of `OceInstance`s. If this header
                appears in the response, then this

                is a partial list of OceInstances. Include this value as the `page`
                parameter in a subsequent

                GET request to get the next batch of OceInstances.

                '
              type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If

                you need to contact Oracle about a particular request,

                please provide the request ID.

                '
              type: string
          schema:
            items:
              $ref: '#/definitions/OceInstanceSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets a list of all OceInstances in a compartment
      tags:
      - oceInstance
    post:
      description: 'Creates a new OceInstance.

        '
      operationId: CreateOceInstance
      parameters:
      - description: Details for the new OceInstance.
        in: body
        name: CreateOceInstanceDetails
        required: true
        schema:
          $ref: '#/definitions/CreateOceInstanceDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The OceInstance will be created.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If

                you need to contact Oracle about a particular request,

                please provide the request ID.

                '
              type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous
                request. You can use this to query status of the asynchronous operation.

                '
              type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a new OceInstance
      tags:
      - oceInstance
