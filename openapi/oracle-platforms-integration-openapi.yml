        enum: &id004
        - UCM
        - GOV
        - OIC4SAAS
        type: string
      customEndpoint:
        $ref: '#/definitions/CreateCustomEndpointDetails'
      definedTags:
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types
              are

              supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values
            scoped

            to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Usage of predefined tag keys. These predefined keys are scoped
          to

          namespaces.

          Example: `{"foo-namespace": {"bar-key": "value"}}`

          '
        type: object
      displayName:
        description: Integration Instance Identifier.
        type: string
      domainId:
        description: 'The OCID of the identity domain, that will be used to determine
          the

          corresponding Idcs Stripe and create an Idcs application within the stripe.

          This parameter is mutually exclusive with parameter: idcsAt, i.e only one
          of

          two parameters should be specified.

          '
        type: string
      freeformTags:
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined
          name,

          type or scope. Exists for cross-compatibility only.

          Example: `{"bar-key": "value"}`

          '
        type: object
      idcsAt:
        description: IDCS Authentication token. This is required for all realms with
          IDCS. Its optional as its not required for non IDCS realms.
        type: string
      integrationInstanceType:
        description: 'Standard or Enterprise type,

          Oracle Integration Generation 2 uses ENTERPRISE and STANDARD,

          Oracle Integration 3 uses ENTERPRISEX and STANDARDX

          '
        enum: &id006
        - STANDARD
        - ENTERPRISE
        - STANDARDX
        - ENTERPRISEX
        - HEALTHCARE
        type: string
      isByol:
        description: Bring your own license.
        type: boolean
      isDisasterRecoveryEnabled:
        default: false
        description: Is Disaster Recovery enabled or not.
        type: boolean
      isFileServerEnabled:
        default: false
        description: The file server is enabled or not.
        type: boolean
      isVisualBuilderEnabled:
        description: Visual Builder is enabled or not.
        type: boolean
      messagePacks:
        default: 1
        description: The number of configured message packs
        type: integer
      networkEndpointDetails: *id001
      securityAttributes: &id007
        additionalProperties:
          additionalProperties:
            description: 'Attribute value and mode. Only the String type is supported
              for value. Mode is currently always "enforce".

              '
            type: object
          description: 'Key-value pair representing a security attribute key and value,
            scoped to a namespace.


            Example: `{"MaxEgressCount": {"value": "42", "mode": "enforce"}}`

            '
          type: object
        description: 'Security attributes for this resource. Each key is predefined
          and scoped to a namespace.

          For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


          Example: `{"Oracle-ZPR": {"MaxEgressCount": {"value": "42", "mode": "enforce"}}}`

          '
        type: object
      shape:
        description: Shape
        enum: &id008
        - DEVELOPMENT
        - PRODUCTION
        type: string
    required:
    - displayName
    - integrationInstanceType
    - compartmentId
    - isByol
    - messagePacks
    type: object
