basePath: /20190131
definitions:
  AddLogAnalyticsLogGroupDetails:
    description: 'Input payload to ADD Log Analytics Log Group for given IntegrationInstance.

      Some actions may not be applicable to specific integration types.

      '
    properties:
      logGroupId:
        description: Log Group ocid.
        type: string
    required:
    - logGroupId
    type: object
  AddOracleManagedCustomEndpointDetails:
    description: Details for enabling Oracle Managed custom endpoint
    properties:
      dnsType: &id002
        description: Type of DNS.
        enum:
        - OCI
        type: string
      dnsZoneName:
        description: DNS Zone name
        type: string
      hostname:
        description: Oracle managed custom hostname
        type: string
    required:
    - hostname
    type: object
  AttachmentDetails:
    description: Description of an attachments for this instance
    properties:
      isImplicit:
        description: '* If role == `PARENT`, the attached instance was created by
          this service instance

          * If role == `CHILD`, this instance was created from attached instance on
          behalf of a user

          '
        type: boolean
      targetId:
        description: The OCID of the target instance (which could be any other OCI
          PaaS/SaaS resource), to which this instance is attached.
        type: string
      targetInstanceUrl:
        description: The dataplane instance URL of the attached instance
        type: string
      targetRole:
        description: "The role of the target attachment.\n   * `PARENT` - The target\
          \ instance is the parent of this attachment.\n   * `CHILD` - The target\
          \ instance is the child of this attachment.\n"
        enum:
        - PARENT
        - CHILD
        type: string
      targetServiceType:
        description: The type of the target instance, such as "FUSION".
        type: string
    required:
    - targetRole
    - isImplicit
    - targetId
    - targetInstanceUrl
    - targetServiceType
    type: object
  ChangeIntegrationInstanceCompartmentDetails:
    description: The information to be updated.
    properties:
      compartmentId:
        description: Compartment Identifier.
        maxLength: 255
        minLength: 1
        type: string
    type: object
  ChangeIntegrationInstanceNetworkEndpointDetails:
    description: 'Input payload to update an Integration instance endpoint details.
      An empty payload will clear out any existing configuration.


      Some actions may not be applicable to specific integration types,

      see [Differences in Instance Management](https://www.oracle.com/pls/topic/lookup?ctx=en/cloud/paas/application-integration&id=INTOO-GUID-931B5E33-4FE6-4997-93E5-8748516F46AA__GUID-176E43D5-4116-4828-8120-B929DF2A6B5E)

      for details.

      '
    properties:
      networkEndpointDetails: &id001
        $ref: '#/definitions/NetworkEndpointDetails'
  ChangePrivateEndpointOutboundConnectionDetails:
    description: 'Input payload to ADD/REMOVE Private Endpoint Outbound Connection
      for given IntegrationInstance.


      Some actions may not be applicable to specific integration types,

      see [Differences in Instance Management](https://www.oracle.com/pls/topic/lookup?ctx=en/cloud/paas/application-integration&id=INTOO-GUID-931B5E33-4FE6-4997-93E5-8748516F46AA__GUID-176E43D5-4116-4828-8120-B929DF2A6B5E)

