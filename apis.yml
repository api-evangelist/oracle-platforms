aid: oracle-platforms
name: Oracle Platforms
description: 'Oracle Platforms is the API Evangelist index of Oracle''s cloud and enterprise platform
  APIs: the Oracle Cloud Infrastructure (OCI) control plane for compute, storage, networking and databases,
  plus the PaaS and SaaS services layered on it — Autonomous Database, Integration Cloud, Content Management,
  Fusion Cloud ERP, Analytics Cloud, Data Science and APEX. Oracle publishes a machine-readable index
  of every OCI service specification at docs.oracle.com/en-us/iaas/api/specs/index.json, and six of those
  contracts — 1,154 operations across Core Services, Database, Data Science, Analytics, Integration and
  Content Management — are harvested verbatim into this repo. Authentication is RSA request signing rather
  than a bearer token, idempotency is the opc-retry-token header, and Oracle ships both managed remote
  MCP servers and 32 open-source reference MCP servers.'
type: Index
