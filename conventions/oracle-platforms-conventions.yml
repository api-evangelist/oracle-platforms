auth:
  style: request-signing
  summary: >-
    OCI does not use a bearer token on the control plane. Every request is SIGNED with an
    RSA private key whose public half is uploaded to the calling user, following the HTTP
    Signatures draft. See authentication/oracle-platforms-authentication.yml.
  note: >-
    None of the six harvested specs declares a securityDefinitions block at all — the auth
    model is documented in prose and implemented in the SDKs, not in the contract. That is a
    real contract gap, and it is why authentication/ is method:searched rather than derived.
idempotency:
  supported: true
  mechanism: header
  header: opc-retry-token
  scope: per-request
  retention: 24 hours
  max_length: 64
  min_length: 1
  operations_supporting: 396
  operations_total: 1150
  coverage_note: >-
    Counted by parsing every operation's parameter list for the RetryTokenHeader reference:
    core 154/490, database 160/444, data-science 48/155, analytics 18/29, integration 14/22,
    content-management 2/10. Coverage tracks the write surface — the token is offered on
    creates and other non-idempotent mutations, not on reads.
  description_verbatim: >-
    A token that uniquely identifies a request so it can be retried in case of a timeout or
    server error without risk of executing that same action again. Retry tokens expire after
    24 hours, but can be invalidated before then due to conflicting operations (for example,
    if a resource has been deleted and purged from the system, then a retry of the original
    creation request may be rejected).
  failure_mode:
    status: 409
    code: InvalidatedRetryToken
    meaning: >-
      The token was invalidated by a subsequent conflicting operation. The safe response is
      to re-read state, not to reissue with a fresh token.
concurrency:
  supported: true
  mechanism: etag + if-match
  request_header: if-match
  response_field: etag
  operations_supporting: 489
  description_verbatim: >-
    For optimistic concurrency control. In the PUT or DELETE call for a resource, set the
    if-match parameter to the value of the etag from a previous GET or POST response for
    that resource. The resource will be updated or deleted only if the etag you provide
    matches the resource's current etag value.
  failure_mode:
    status: 412
    code: NoEtagMatch
pagination:
  style: opaque-cursor
  request_params:
    - name: limit
      in: query
      description: Maximum items to return per page.
    - name: page
      in: query
      description: >-
        The opaque page token from a previous response's opc-next-page header. Not an
        offset — it must be echoed verbatim.
  response_headers:
    - name: opc-next-page
      description: Opaque token for the next page; absent when the listing is exhausted.
      occurrences: 243
    - name: opc-prev-page
      description: Opaque token for the previous page, where the service supports it.
      occurrences: 24
  operations_paginated: 236
  agent_note: >-
    Termination is signalled by ABSENCE of opc-next-page, not by an empty page or a total
    count. There is no total-results field anywhere in the six specs, so an agent cannot
    know the size of a listing before walking it.
tracing:
  request_id_header: opc-request-id
  occurrences: 1207
  behaviour: >-
    Caller may supply it; the service echoes it on the response. Oracle's docs instruct
    callers to quote it when opening a support request about a failure.
async:
  model: work-requests
  header: opc-work-request-id
  occurrences: 388
  description: >-
    Mutating operations that cannot complete synchronously return 202 with a work-request
    OCID. The caller polls the Work Requests API for terminal status. A 202 is NOT success —
    treating it as one is the most common agent error against this API.
versioning:
  style: date-in-basePath
  examples:
    - Core Services API — /20160918
    - Database Service API — /20160918
    - Oracle Integration API — /20190131
    - Analytics API — /20190331
    - Data Science API — /20190101
    - Oracle Content Management API — /20190912
  note: >-
    Each OCI service pins its own YYYYMMDD version segment in the base path, set at service
    launch. There is no global API version and no version negotiation header. Some of these
    dates are a decade old and still current — the date is an identity, not a freshness
    signal.
