rate_limit_signaling:
  status_on_exhaustion: 429
  code: TooManyRequests
  headers: none-documented
  note: >-
    No X-RateLimit-*, no RateLimit-*, no Retry-After is documented for the OCI control
    plane. Oracle's published remediation is to "add some delays between requests". This is
    the weakest link in an otherwise strong runtime-semantics story: an agent gets a 429
    with no machine-readable hint of when to come back. See rate-limits/.
identifiers:
  scheme: OCID
  format: 'ocid1.<resource-type>.<realm>.[region][.future use].<unique ID>'
  docs: https://docs.oracle.com/en-us/iaas/Content/General/Concepts/identifiers.htm
  note: >-
    Every resource in every one of the six APIs is addressed by an OCID. The type segment
    makes an identifier self-describing, so an agent can tell a compartment id from an
    instance id without a lookup.
reversibility:
  applicable: true
  grade: documented
  grade_note: >-
    Graded `documented` rather than `verified` for the surface as a whole. Real reversal
    operations exist and are named below, and ONE of them (Autonomous Database restore) has
    a window Oracle states in its own docs. The rest — instance and DB-system termination,
    detach operations, work-request cancellation — publish a reversal path with no stated
    window, so the surface-level grade is held at documented rather than promoted on the
    strength of a single verified path. No window is asserted here that Oracle does not
    state.
  read_only: false
  reversals:
    - operation: RestoreAutonomousDatabase
      spec: openapi/oracle-platforms-database-openapi.yml
      reverses: Data loss / unwanted change to an Autonomous Database
      window: >-
        Point-in-time restore is bounded by the automatic backup retention period, which
        Oracle states as "a retention period between 1 day and up to 60 days" (configurable
        per database).
      window_verified: true
      docs: https://docs.oracle.com/en/cloud/paas/autonomous-database/serverless/adbsb/backup-restore.html
    - operation: RestoreDatabase
      spec: openapi/oracle-platforms-database-openapi.yml
      reverses: Data loss / unwanted change to a Database Service database
      window: not stated in the operation description
      window_verified: false
    - operation: RestoreArchivedModelArtifact
      spec: openapi/oracle-platforms-data-science-openapi.yml
      reverses: Archival of a model artifact
      window: not stated
      window_verified: false
    - operation: RecoverMlApplicationInstanceView
      spec: openapi/oracle-platforms-data-science-openapi.yml
      reverses: A failed ML application instance view
      window: not stated
      window_verified: false
    - operation: CancelWorkRequest
      spec: openapi/oracle-platforms-core-openapi.yml
      reverses: An in-flight asynchronous operation, before it completes
      window: while the work request is still in a cancellable state
      window_verified: false
    - operation: CancelJobRun
      spec: openapi/oracle-platforms-data-science-openapi.yml
      reverses: An in-flight Data Science job run
      window: while the run is in progress
      window_verified: false
    - operation: CancelPipelineRun
      spec: openapi/oracle-platforms-data-science-openapi.yml
      reverses: An in-flight Data Science pipeline run
      window: while the run is in progress
      window_verified: false
  irreversible:
    - operation: TerminateInstance
      spec: openapi/oracle-platforms-core-openapi.yml
      note: >-
        No un-terminate operation exists. Boot-volume preservation is a parameter ON the
        terminate call, decided BEFORE the action, not afterwards — which is exactly the
        thing an agent needs to know before it acts.
    - operation: TerminateDbSystem
      spec: openapi/oracle-platforms-database-openapi.yml
    - operation: TerminateAutonomousContainerDatabase
      spec: openapi/oracle-platforms-database-openapi.yml
    - operation: TerminateInstancePool
      spec: openapi/oracle-platforms-core-openapi.yml
  agent_guidance: >-
    Before any Terminate* call, assume no undo. Before any Delete* call, check whether the
    service offers a scheduled-deletion window (several OCI services do; none of the six
    documents harvested here state one in the operation description). Cancellation of
    asynchronous work is available through the work-request surface and is the cheapest
    reversal in this API.
