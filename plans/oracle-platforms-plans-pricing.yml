specification: API Commons Plans
specificationVersion: '0.1'
generated: '2026-08-27'
method: searched
source: >-
  https://www.oracle.com/cloud/free/ and https://www.oracle.com/cloud/price-list.html
  (both HTTP 200 with a browser User-Agent on 2026-08-27)
provider: Oracle Platforms
providerId: oracle-platforms
created: '2026-05-04'
modified: '2026-08-27'
supersedes: >-
  The 2026-05-04 bulk-sweep scaffold that previously occupied this file, which invented a
  Free / Professional / Enterprise ladder with 1,000 and 100,000 monthly API-request quotas
  and TBD overage pricing. Oracle sells none of those things. Replaced with Oracle's actual
  commercial model.
description: >-
  Oracle's commercial model for these APIs. The critical fact for an API consumer: Oracle
  does not price API CALLS. There is no per-request charge, no request quota, and no
  API tiering across the OCI control plane — the six APIs profiled here are the management
  interface to resources, and the resources are what is metered. Rate limits exist (see
  rate-limits/) but they are protective throttles, not billing boundaries.
billing_model: consumption-of-resources
api_call_pricing: none
api_call_pricing_note: >-
  Control-plane API calls against Core Services, Database, Data Science, Analytics,
  Integration and Content Management are not separately billed. Cost is a function of the
  compute, storage, database and service instances those calls create and run.
plans:
  - id: oracle-cloud-free-tier
    name: Oracle Cloud Free Tier
    type: freemium
    price: '0.00'
    currency: USD
    description: >-
      Two components. (1) A 30-day trial carrying US$300 in cloud credits, usable across all
      OCI services. (2) Always Free Services, which have no time limit and continue after
      the trial credits expire or are consumed. If nothing is done after 30 days the account
      converts to Always Free only.
    trial:
      credit: '300.00'
      currency: USD
      period_days: 30
    always_free: true
    url: https://www.oracle.com/cloud/free/
    signup: https://signup.oraclecloud.com/
  - id: oracle-cloud-pay-as-you-go
    name: Pay As You Go
    type: usage-based
    price: metered
    currency: USD
    description: >-
      Post-paid consumption billing. Pay only for services that exceed the monthly free
      amounts included in Always Free Services. Per-service unit rates are published on the
      Cloud Price List; Oracle states the same rate applies in every commercial region.
    url: https://www.oracle.com/cloud/price-list.html
  - id: oracle-universal-credits
    name: Annual Universal Credits
    type: committed-spend
    price: custom
    currency: USD
    description: >-
      Prepaid annual commitment drawn down against any eligible OCI service, at discounted
      rates versus Pay As You Go. Negotiated; no public price.
  - id: oracle-byol
    name: Bring Your Own License
    type: license-transfer
    price: custom
    currency: USD
    description: >-
      Existing on-premises Oracle Database and middleware licences applied against the OCI
      equivalent, reducing the metered rate. Relevant to the Autonomous Database and
      Database Service APIs profiled here.
plan_count: 4
