standards:
  - id: openapi
    name: OpenAPI / Swagger
    conforms: true
    version: '2.0'
    evidence: >-
      All six harvested documents are Swagger 2.0 with a `swagger: "2.0"` key and a populated
      paths object — 1,154 operations total. Oracle publishes them itself from a
      machine-readable index at docs.oracle.com/en-us/iaas/api/specs/index.json. Note the
      version: Oracle is still emitting Swagger 2.0 in 2026, not OpenAPI 3.x, which limits
      what tooling can express (no callbacks, no oneOf, no per-server variables).
  - id: http-signatures
    name: HTTP Signatures (draft-cavage-http-signatures)
    conforms: true
    evidence: >-
      OCI request signing implements the HTTP Signatures draft — RSA-SHA256 over
      (request-target), host, date/x-date, and for bodied methods content-length,
      content-type and x-content-sha256. Documented at
      docs.oracle.com/en-us/iaas/Content/API/Concepts/apisigningkey.htm.
  - id: oauth2
    name: OAuth 2.0
    conforms: true
    scope: identity-domains
    evidence: >-
      OCI IAM Identity Domains are a full OAuth 2.0 authorization server; the managed
      Database Tools MCP Server authenticates through it. NOT used by the control-plane APIs
      profiled here, which use request signing instead.
  - id: oidc
    name: OpenID Connect
    conforms: true
    scope: identity-domains
    evidence: >-
      Identity Domains serve OIDC discovery at
      https://idcs-<tenancy-id>.identity.oraclecloud.com/.well-known/openid-configuration.
      Tenancy-scoped, so it could not be fetched anonymously in this pass.
  - id: scim
    name: SCIM 2.0
    conforms: true
    scope: identity-domains
    evidence: >-
      OCI IAM Identity Domains expose a SCIM 2.0 API, and Oracle's own rate-limit table for
      identity domains is organised around SCIM operation classes (Bulk, Import/Export).
      This is a DOMAIN-STANDARD signature for the identity market: a consumer who already
      speaks SCIM provisions against Oracle with no bespoke connector.
    domain_standard: true
    confidence: medium
    confidence_note: >-
      Asserted from Oracle's identity-domain documentation and the SCIM-shaped rate-limit
      taxonomy, NOT from a schema URN observed in a harvested contract. No
      urn:ietf:params:scim:schemas:* URN appears in any of the six specs in openapi/,
      because none of them is the identity-domains contract.
  - id: cloudevents
    name: CloudEvents
    conforms: true
    domain_standard: true
    evidence: >-
      Oracle's own Events documentation states OCI events are emitted "in the CloudEvents
      industry standard format" hosted by the CNCF, and the event reference page shows a
      cloudEventsVersion field on every event type. Delivery is to Notifications, Streaming
      or Functions. Fetched at HTTP 200 on 2026-08-27:
      docs.oracle.com/en-us/iaas/Content/Events/Concepts/eventsoverview.htm and
      docs.oracle.com/en-us/iaas/Content/Events/Reference/eventsproducers.htm
