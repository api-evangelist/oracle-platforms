    conforms: true
    evidence: >-
      opc-retry-token header, 24-hour token lifetime, offered on 396 of 1,150 operations,
      with a dedicated 409 InvalidatedRetryToken failure code. See conventions/.
  - id: pagination
    name: Cursor pagination
    conforms: true
    evidence: >-
      opc-next-page opaque cursor on 236 operations, paired with limit and page query
