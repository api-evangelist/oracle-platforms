  - code: NotAllowed
    status: 403
    title: The operation must be directed at the tenancy home region
    retryable: false
  - code: NotAuthorized
    status: 403
    title: The caller is not authorized to update fields in the request
    retryable: false
  - code: SignUpRequired
    status: 403
    title: The operation requires an opt-in before it can be called
    retryable: false
  - code: NotAuthorizedOrNotFound
    status: 404
    title: The resource at the URI was not found, or the caller is not authorized to see it
    retryable: false
    note: >-
      Deliberately ambiguous — OCI collapses "does not exist" and "you may not see it" into
      one code so the API does not leak resource existence to an unauthorized caller. An
      agent must not treat this as proof of absence.
  - code: NotFound
