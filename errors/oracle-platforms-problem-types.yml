provider: Oracle Platforms
providerId: oracle-platforms
format: oracle-oci-error
format_note: >-
  NOT RFC 9457. OCI predates problem+json and ships its own envelope: a JSON object with a
  short machine-readable `code` string and a human `message`, served as application/json.
  No `type` URI, no `title`, no `instance`. The observed live shape, seen unauthenticated
  on https://iaas.us-ashburn-1.oraclecloud.com/.well-known/security.txt during this pass,
  is {"code": "NotAuthorizedOrNotFound", "message": "..."}. Every one of the 1,154
  operations in the harvested specs declares 400/401/404/429/500 responses, so the envelope
  is uniform across the whole control plane.
envelope:
  media_type: application/json
  fields:
    - name: code
      description: Short machine-readable error identifier, e.g. NotAuthorizedOrNotFound.
    - name: message
      description: Human-readable explanation of the failure.
correlation:
  header: opc-request-id
  description: >-
    Returned on requests and echoed on responses; Oracle's docs instruct callers to supply
    it when contacting OCI support about a failed request. Present on 1,207 operation
    definitions across the harvested specs — it is the tracing primitive for this API.
  async_header: opc-work-request-id
  async_description: >-
    Long-running operations return a work-request OCID in opc-work-request-id (388
    occurrences); the caller polls the Work Requests API for terminal state rather than
    treating the 202 as completion.
problem_types:
  - code: CannotParseRequest
    status: 400
    title: Request is incorrectly formatted
    retryable: false
  - code: InvalidParameter
    status: 400
    title: A parameter is invalid or incorrectly formatted
    retryable: false
    note: Also returned at 404 when a dynamic path component is invalid or not allowed.
  - code: LimitExceeded
    status: 400
    title: Request exceeds an Oracle-defined limit for the tenancy
    retryable: false
