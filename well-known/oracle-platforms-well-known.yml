note: >-
  Oracle serves NO /.well-known/ discovery document on any host reachable in this
  profile, and no common[] WellKnown or SecurityTxt pointer is emitted as a result.
  Three distinct failure shapes were observed and are recorded verbatim below:
  (1) www.oracle.com and developer.oracle.com 30x every /.well-known/* path back to the
  site root — following the redirect lands on an edge bot-challenge page (fw_error_www,
  HTTP 403), so the paths were never served, they were bounced;
  (2) docs.oracle.com returns a real, identical 15,118-byte "Page not found" 404 for
  every path — an honest absence;
  (3) cloud.oracle.com is a SPA catch-all: /.well-known/openid-configuration,
  /oauth-authorization-server and /api-catalog each return HTTP 200 with a byte-identical
  22,935-byte HTML console shell, while /security.txt, /agent-card.json and /agent.json
  on the same host return a genuine 404. Those three 200s are NOT documents and are
  recorded as soft_404 with no file saved, per the catch-all rule.
  The regional OCI API hosts (iaas./database..oraclecloud.com) answer every unauthenticated
  path with the OCI control-plane error envelope {"code":"NotAuthorizedOrNotFound"} at 404.
  Oracle DOES publish OIDC discovery, but only per-tenancy from an IAM identity domain
  host (https://idcs-<tenancy-id>.identity.oraclecloud.com/.well-known/openid-configuration),
  which has no anonymous, tenancy-independent address to probe. That is a real Oracle
  surface this pipeline cannot reach, not an absence.
